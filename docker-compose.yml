services:
  cortexforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortexforge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - public_net
      - internal_net
    environment:
      - CORTEX_ENV=${CORTEX_ENV:-production}
      - CORTEX_AUTH_STRICT=${CORTEX_AUTH_STRICT:-true}
      - "CORTEX_DB_URL=postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:?Required: set POSTGRES_PASSWORD in environment}@postgres:5432/${POSTGRES_DB:-cortexforge}"
      - CORTEX_EMBEDDINGS_PROVIDER=${CORTEX_EMBEDDINGS_PROVIDER:-openai}
      - CORTEX_LLM_PROVIDER=${CORTEX_LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORTEX_TELEMETRY=disabled
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - cortex_data:/root/.cortexforge
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cortexforge-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortexforge-worker
    restart: unless-stopped
    command: ["python", "-m", "cortexforge.jobs.worker"]
    networks:
      - internal_net
    environment:
      - CORTEX_ENV=${CORTEX_ENV:-production}
      - CORTEX_AUTH_STRICT=${CORTEX_AUTH_STRICT:-true}
      - "CORTEX_DB_URL=postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:?Required: set POSTGRES_PASSWORD in environment}@postgres:5432/${POSTGRES_DB:-cortexforge}"
      - CORTEX_EMBEDDINGS_PROVIDER=${CORTEX_EMBEDDINGS_PROVIDER:-openai}
      - CORTEX_LLM_PROVIDER=${CORTEX_LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORTEX_TELEMETRY=disabled
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - cortex_data:/root/.cortexforge
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cortexforge-postgres
    restart: unless-stopped
    networks:
      - internal_net
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cortex}
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Required: set POSTGRES_PASSWORD in environment}"
      - POSTGRES_DB=${POSTGRES_DB:-cortexforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortexforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cortexforge-redis
    restart: unless-stopped
    networks:
      - internal_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

volumes:
  cortex_data:
  postgres_data:
  redis_data:
